server:
  port: 8082

spring:
  config:
    import:
      - classpath:application-datasource.yml
      - classpath:application-auth.yml
  application:
    name: report-service
  datasource:
    hikari:
      pool-name: report-pool
  jackson:
    serialization:
      indent-output: true

clients:
  revenue:
    base-url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
  level:
    com.learn: info
