# Both services import this file.
# jdbc:h2:mem is an in-memory database. It lives inside the process and
# needs no installed database server. Each service gets its own copy.
spring:
  datasource:
    url: jdbc:h2:mem:microserv;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: optional:classpath:data.sql
